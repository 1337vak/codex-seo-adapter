name: Validate and publish adapter
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adapter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - run: npm install --global @openai/codex@0.167.0 --ignore-scripts
      - run: python3 scripts/port.py build
      - run: python3 scripts/port.py verify --native
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/
          include-hidden-files: true
  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: plugin
          path: build
      # Artifact transport does not preserve Unix executable bits; restore from the manifest.
      - run: python3 scripts/port.py restore-modes
      - run: python3 scripts/port.py publish
        env:
          GH_TOKEN: ${{ github.token }}
